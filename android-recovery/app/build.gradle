plugins { id 'com.android.application' }
android {
    namespace 'com.motonav.companion'
    compileSdk 35
    defaultConfig {
        applicationId 'com.motonav.recovery'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-recovery-dial'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = true } }
}

// Official combined navigation/map/location/search SDK: do not add overlapping standalone SDK jars.
dependencies { implementation 'com.amap.api:navi-3dmap-location-search:11.3.100_3dmap11.3.100_loc11.3.000_sea9.8.1' }
