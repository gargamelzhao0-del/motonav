name: Android recovery checks
on:
  push:
    branches: ['recovery/**', 'codex/**']
    paths: ['android-recovery/**', 'moto_esp32/**', '.github/workflows/android-recovery.yml', '.github/workflows/android-update-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pure Java checks
        run: sh tests/run.sh
      - name: Android compile and lint
        run: gradle --no-daemon assembleDebug lintDebug assembleRelease
      - name: Verify temporary APK and exercise update packaging
        env:
          MOTONAV_KEY_ALIAS: ci-preview
          MOTONAV_KEYSTORE_PASSWORD: android
          MOTONAV_KEY_PASSWORD: android
        run: |
          set -eu
          export MOTONAV_KEYSTORE="$RUNNER_TEMP/motonav-ci-preview.p12"
          keytool -genkeypair -storetype PKCS12 -keystore "$MOTONAV_KEYSTORE" \
            -storepass "$MOTONAV_KEYSTORE_PASSWORD" -keypass "$MOTONAV_KEY_PASSWORD" \
            -alias "$MOTONAV_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=MotoNav CI Preview" -noprompt
          sh tools/package-update.sh app/build/outputs/apk/release/app-release-unsigned.apk test-delivery
          printf 'Commit: %s\nPackage: com.motonav.recovery\nTemporary CI signature. Parking-only test. The manifest is a packaging preview and has not been published.\n' "$GITHUB_SHA" > test-delivery/BUILD.txt
          cat test-delivery/certificate.txt test-delivery/SHA256SUMS.txt test-delivery/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: motonav-recovery-parking-test
          path: android-recovery/test-delivery/
          if-no-files-found: error
          retention-days: 7


  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Firmware dependency boundaries, protocol, sessions and raster checks
        run: python3 moto_esp32/tests/run_host_tests.py
      - name: Build production without tests and optional device benchmark
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: moto_esp32
          # Match the measured local toolchain. Older resolver versions can
          # introduce a second, newer LVGL while reconfiguring this lockfile.
          command: >-
            python -m pip install idf-component-manager==2.4.10 &&
            idf.py reconfigure &&
            test "$(cat managed_components/lvgl__lvgl/.component_hash)" = "184e532558c1c45fefed631f3e235423d22582aafb4630f3e8885c35281a49ae" &&
            python tools/export_source.py dist/production-source &&
            ln -s "$PWD/managed_components" dist/production-source/managed_components &&
            idf.py -C dist/production-source build &&
            python tools/verify_production.py dist/production-source/build &&
            idf.py -DMOTONAV_DEVICE_TESTS=ON -DMOTONAV_AUTORUN_BENCH=ON build
      - name: LVGL layouts, map animation and navigation takeover
        run: |
          cmake -S moto_esp32/tests/lvgl_host -B moto_esp32/build-host
          cmake --build moto_esp32/build-host -j2
          ctest --test-dir moto_esp32/build-host --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: motonav-175c-navigation-test
          path: |
            moto_esp32/dist/production-source/build/motonav.bin
            moto_esp32/dist/production-source/build/bootloader/bootloader.bin
            moto_esp32/dist/production-source/build/partition_table/partition-table.bin
            moto_esp32/dist/production-source/build/flash_args
            moto_esp32/dist/production-source/build/flasher_args.json
          if-no-files-found: error
          retention-days: 7
