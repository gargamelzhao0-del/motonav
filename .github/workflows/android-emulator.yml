name: Android emulator navigation tests
on:
  push:
    branches: ['codex/navigation-simulation']
    paths: ['android-recovery/**', '.github/workflows/android-emulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM for this disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-motonav-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation APKs
        working-directory: android-recovery
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run on Android 11 with ARM native translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            mkdir -p android-recovery/emulator-evidence
            adb shell getprop ro.build.fingerprint > android-recovery/emulator-evidence/runtime.txt
            adb shell getprop ro.product.cpu.abilist >> android-recovery/emulator-evidence/runtime.txt
            adb shell getprop ro.dalvik.vm.native.bridge >> android-recovery/emulator-evidence/runtime.txt
            gradle -p android-recovery --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.motonav.recovery/files/emulator-evidence android-recovery/emulator-evidence/app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motonav-android-emulator-evidence
          path: |
            android-recovery/app/build/reports/androidTests/
            android-recovery/app/build/outputs/androidTest-results/
            android-recovery/emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
